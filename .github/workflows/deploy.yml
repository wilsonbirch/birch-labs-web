name: fly

# Deploys main to the birch-labs-web Fly app on every merge (a push to main).
# PRs are gated by ci.yml before they can merge. Manual runs stay available.
on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: fly-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy prod
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: superfly/flyctl-actions/setup-flyctl@master

            # Build args + runtime env are configured in fly.toml.
            # Runtime secrets (RESEND_API_KEY, CONTACT_FORM_TO_EMAIL, etc.)
            # are set via `fly secrets set`.
            - name: Deploy
              run: flyctl deploy --remote-only
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
