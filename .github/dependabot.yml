version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pin @types/node major to runtime Node version (currently 22 LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed context.getFilename(); eslint-config-next@16.x ships
      # a nested eslint-plugin-react that still calls it, so lint blows up.
      # Hold ESLint majors until Vercel publishes an eslint-config-next that
      # supports ESLint 10. Unignore once that lands.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
