version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pin @types/node major to runtime Node version (currently 22 LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the Go port) is unsupported by typescript-eslint 8.x
      # (peer range typescript <6.1.0), which eslint-config-next@16.x pulls
      # in, so lint crashes on load. Hold TS majors until typescript-eslint
      # ships TS 7 support. Unignore once that lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
