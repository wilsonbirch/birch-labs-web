# Fly.io config for birchlabs.ca.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'birch-labs-web'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

  # NEXT_PUBLIC_* values are inlined into the client bundle at build
  # time. They are not secret. Bump NEXT_PUBLIC_SITE_URL when you
  # attach a custom domain.
  [build.args]
    NEXT_PUBLIC_SITE_URL = 'https://birchlabs.ca'

# Runtime config — visible in fly.toml (i.e. in git). Only put
# non-secret values here. RESEND_API_KEY, CONTACT_FORM_TO_EMAIL, and
# CONTACT_FORM_FROM_EMAIL are Fly secrets (fly secrets set KEY=value);
# without them the contact form returns 500 in production.
[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  # Scales to zero when idle: near-free, but the first visit after idle
  # cold-starts (~2-5s). Set min_machines_running = 1 to keep one warm.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
